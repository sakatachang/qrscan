<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>アイカツスターズ！QRスキャン</title>
<style>
:root{
  --bg:#fff7fb; --panel:#fff; --line:#efd9e7; --text:#2d2130; --muted:#7d6d79;
  --accent:#e455a8; --accent2:#7658e8; --ok:#20a464; --warn:#d18a00; --danger:#d94b59;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",Meiryo,sans-serif}
body{min-height:100vh}
.app{max-width:760px;margin:auto;padding:8px 10px 92px}
.hidden{display:none!important}

.topbar{
  position:sticky;top:0;z-index:12;background:rgba(255,247,251,.97);backdrop-filter:blur(10px);
  padding:6px 0 8px;
}
.topcontrols{display:grid;grid-template-columns:1.25fr .75fr;gap:7px;margin-bottom:7px}
select,button,input,textarea{font:inherit}
select,input,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px;background:#fff;color:var(--text)}
button{border:0;border-radius:11px;padding:10px 12px;background:#f8ecf4;color:#452c3c;font-weight:700;cursor:pointer}
button.primary{background:var(--accent);color:#fff}
button.secondary{background:var(--accent2);color:#fff}
button.ok{background:var(--ok);color:#fff}
button.warn{background:#fff3da;color:#8b5e00}
button.danger{background:#ffe8ec;color:#a13043}
button:disabled{opacity:.45}

.current{
  display:grid;grid-template-columns:82px 1fr;gap:10px;background:#fff;border:1px solid var(--line);
  border-radius:15px;padding:8px;box-shadow:0 3px 14px rgba(228,85,168,.08)
}
.thumb{
  width:82px;height:123px;border-radius:10px;object-fit:contain;background:#faf3f8;border:1px solid var(--line)
}
.number{font-size:16px;font-weight:900;color:var(--accent);margin-bottom:2px}
.name{font-size:16px;font-weight:800;line-height:1.25;margin-bottom:7px}
.infoGrid{
  display:grid;grid-template-columns:1fr 1fr;gap:4px 8px;margin-bottom:6px
}
.infoItem{font-size:11px;line-height:1.3}
.infoLabel{color:var(--muted);margin-right:4px}
.dresskey{
  font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  margin-top:2px
}
.progressrow{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--muted);margin-top:6px}
.bar{height:6px;background:#faeaf3;border-radius:999px;overflow:hidden;margin-top:3px}
.bar>div{height:100%;background:linear-gradient(90deg,var(--accent),#f87ab8);width:0%}

.scannerPanel{
  background:#fff;border:1px solid var(--line);border-radius:16px;padding:8px;margin-top:8px;
  box-shadow:0 3px 14px rgba(228,85,168,.06)
}
#reader{width:100%;max-width:520px;margin:0 auto;overflow:hidden;border-radius:12px}
.scanmsg{font-weight:800;text-align:center;padding:8px;border-radius:10px;background:#fbf0f6;margin-top:7px;font-size:13px}
.scanmsg.ok{background:#e8f9f0;color:#1e8753}
.scanmsg.warn{background:#fff4df;color:#8b5e00}
.scanmsg.danger{background:#ffe9ec;color:#b23047}
.scanbuttons{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:7px}
.nav{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:7px}
.qrstate{
  margin-top:7px;padding:7px 9px;border-radius:10px;background:#fffafd;border:1px dashed #ebb8d4;
  font-size:11px;word-break:break-all;max-height:46px;overflow:auto
}

details{background:#fff;border:1px solid var(--line);border-radius:15px;padding:10px;margin-top:10px}
summary{font-weight:800;cursor:pointer}
.section{margin-top:10px}
.tiny{font-size:11px;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1 1 220px}
.searchbox{display:grid;grid-template-columns:1fr auto;gap:7px}

.stickyBottom{
  position:fixed;left:0;right:0;bottom:0;z-index:15;background:rgba(255,247,251,.97);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);padding:7px max(10px,env(safe-area-inset-right)) calc(7px + env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))
}
.stickyBottom .inner{max-width:760px;margin:auto;display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}

.flash{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:50;pointer-events:none;opacity:0;transition:opacity .18s;background:rgba(255,255,255,.82)}
.flash.show{opacity:1}
.flashBox{background:#fff;border:2px solid #bfe8d0;border-radius:20px;padding:20px 24px;text-align:center;box-shadow:0 8px 28px rgba(0,0,0,.12);max-width:85%}
.flashCheck{font-size:42px;color:var(--ok);line-height:1}
.flashName{font-weight:900;font-size:18px;margin-top:6px}
.flashNo{font-size:13px;color:var(--muted);margin-top:3px}

@media(max-height:720px){
  .thumb{width:70px;height:105px}
  .current{grid-template-columns:70px 1fr}
  .name{font-size:15px;margin-bottom:4px}
  .infoItem{font-size:10px}
}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="topcontrols">
      <select id="volumeSelect"></select>
      <select id="filterSelect">
        <option value="all">すべて</option>
        <option value="unregistered">未登録のみ</option>
        <option value="registered">登録済みのみ</option>
      </select>
    </div>

    <div class="current">
      <img id="cardImg" class="thumb" alt="">
      <div>
        <div class="number" id="cardNo"></div>
        <div class="name" id="cardName"></div>

        <div class="infoGrid">
          <div class="infoItem"><span class="infoLabel">タイプ</span><strong id="infoType">-</strong></div>
          <div class="infoItem"><span class="infoLabel">種類</span><strong id="infoCategory">-</strong></div>
          <div class="infoItem"><span class="infoLabel">レア</span><strong id="infoRarity">-</strong></div>
          <div class="infoItem"><span class="infoLabel">ブランド</span><strong id="infoBrand">-</strong></div>
        </div>

        <div class="dresskey" id="dressKeyTop"></div>

        <div class="progressrow">
          <span id="positionText"></span>
          <span id="progressText"></span>
        </div>
        <div class="bar"><div id="progressBar"></div></div>
      </div>
    </div>
  </div>

  <section class="scannerPanel">
    <div id="reader"></div>
    <div class="scanbuttons">
      <button id="startScanBtn" class="primary">カメラを開始</button>
      <button id="stopScanBtn" disabled>カメラ停止</button>
    </div>
    <div id="scanMsg" class="scanmsg">「カメラを開始」を押してください。</div>
    <div class="nav">
      <button id="prevBtn">← 前へ</button>
      <button id="skipBtn" class="warn">スキップ</button>
      <button id="nextBtn">次へ →</button>
    </div>
    <div id="currentQr" class="qrstate">QR未登録</div>
  </section>

  <details>
    <summary>検索・設定・CSV出力</summary>
    <div class="section">
      <label class="tiny">カード番号・カード名で検索</label>
      <div class="searchbox">
        <input id="searchInput" type="text" placeholder="例: 1-4 / ピクニック">
        <button id="clearSearch">クリア</button>
      </div>
    </div>
    <div class="section row">
      <div class="grow">
        <label class="tiny">自動送り</label>
        <select id="autoNext">
          <option value="500">0.5秒</option>
          <option value="700" selected>0.7秒</option>
          <option value="1000">1.0秒</option>
          <option value="1500">1.5秒</option>
          <option value="0">しない</option>
        </select>
      </div>
      <button id="jumpPrevUnreg">← 前の未登録</button>
      <button id="jumpNextUnreg" class="secondary">次の未登録 →</button>
    </div>
    <div class="section">
      <label class="tiny">手動入力</label>
      <textarea id="manualQr" rows="2" placeholder="QR URLを貼り付け"></textarea>
      <div class="row" style="margin-top:7px">
        <button id="manualSaveBtn">現在のカードに登録</button>
        <button id="clearQrBtn">現在QRを削除</button>
      </div>
    </div>
    <div class="section tiny" id="dressKey"></div>
    <div class="section"><a id="detailLink" class="tiny" href="#" target="_blank" rel="noopener noreferrer">公式詳細ページ</a></div>
    <div class="section row">
      <button id="exportVolumeBtn" class="ok">この弾をCSV出力</button>
      <button id="exportAllBtn" class="ok">全11弾をCSV出力</button>
      <button id="resetBtn" class="danger">登録データを全消去</button>
    </div>
  </details>
</div>

<div class="stickyBottom">
  <div class="inner">
    <button id="bottomPrev">← 前</button>
    <button id="bottomSkip" class="warn">スキップ</button>
    <button id="bottomNext">次 →</button>
  </div>
</div>

<div id="flash" class="flash">
  <div class="flashBox">
    <div class="flashCheck">✓</div>
    <div class="flashName" id="flashName"></div>
    <div class="flashNo" id="flashNo"></div>
  </div>
</div>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  E.volume.onchange=()=>applyFilter(true);E.filter.onchange=()=>applyFilter(true);E.search.oninput=()=>applyFilter(true);
  E.clearSearch.onclick=()=>{E.search.value='';applyFilter(true)};
  [E.prev,E.bPrev].forEach(x=>x.onclick=()=>move(-1));
  [E.next,E.bNext].forEach(x=>x.onclick=()=>move(1));
  [E.skip,E.bSkip].forEach(x=>x.onclick=()=>move(1));
  E.jumpPrev.onclick=()=>jumpUnreg(-1);E.jumpNext.onclick=()=>jumpUnreg(1);
  E.start.onclick=startScanner;E.stop.onclick=stopScanner;E.manualSave.onclick=()=>register(E.manualQr.value);
  E.clearQr.onclick=()=>{if(norm(rows[currentIndex].qr_url)&&!confirm('現在のQRを削除しますか？'))return;rows[currentIndex].qr_url='';render();msg('現在のQRを削除しました。','warn');};
  E.exportVolume.onclick=()=>{const v=E.volume.value;exportRows(rows.filter(r=>norm(r.volume)===v),`aikatsu_stars_${v.replace(/[^\w一-龠ぁ-んァ-ン]/g,'_')}_qr_${stamp()}.csv`)};
  E.exportAll.onclick=()=>exportRows(rows,`aikatsu_stars_all_regular_qr_${stamp()}.csv`);
  E.reset.onclick=()=>{if(!confirm('全11弾の登録済みQRをすべて消去しますか？'))return;rows.forEach(r=>r.qr_url='');currentIndex=0;localStorage.removeItem(STORAGE_KEY);applyFilter(true);msg('登録データを全消去しました。','warn');};
})();
</script>
</body>
</html>
