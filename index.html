<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>アイカツスターズ！1弾 QRスキャン</title>
<style>
:root{
  --bg:#fff7fb; --panel:#fff; --line:#f0d9e8; --text:#2d2130; --muted:#7d6d79;
  --accent:#e455a8; --ok:#20a464; --warn:#d18a00; --danger:#d94b59;
}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(#fff9fc,#fff4fa);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",Meiryo,sans-serif}
.app{max-width:900px;margin:auto;padding:14px 14px 90px}
h1{font-size:20px;margin:6px 0 14px}
.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 3px 14px rgba(228,85,168,.06)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1 1 220px}
button,select,textarea{font:inherit}
button{border:0;border-radius:12px;padding:11px 14px;background:#f8ecf4;color:#452c3c;font-weight:700;cursor:pointer}
button.primary{background:var(--accent);color:#fff}
button.ok{background:var(--ok);color:#fff}
button.warn{background:#fff3da;color:#8b5e00}
button.danger{background:#ffe8ec;color:#a13043}
button:disabled{opacity:.45;cursor:not-allowed}
select,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff;color:var(--text)}
.tiny{font-size:12px;color:var(--muted)}
.statusline{display:flex;justify-content:space-between;gap:12px;font-size:14px;margin-bottom:7px}
.bar{height:10px;background:#faeaf3;border-radius:999px;overflow:hidden}
.bar>div{height:100%;background:linear-gradient(90deg,var(--accent),#f87ab8);width:0%}
.cardwrap{display:grid;grid-template-columns:120px 1fr;gap:12px}
.cardimg{width:100%;aspect-ratio:2/3;border-radius:14px;background:#f8f1f6;border:1px solid var(--line);object-fit:contain}
.noimg{display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);padding:20px}
.number{font-weight:900;color:var(--accent);font-size:17px}
.meta h2{font-size:18px;margin:0 0 6px}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}
.chip{font-size:12px;padding:5px 9px;border-radius:999px;background:#f7eff4}
.qrbox{margin-top:12px;padding:11px;border:1px dashed #ebb8d4;border-radius:12px;word-break:break-all;background:#fffafd;font-size:12px}
.nav{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
#reader{width:100%;max-width:560px;margin:0 auto;overflow:hidden;border-radius:14px}
.scanmsg{font-weight:800;text-align:center;padding:10px;border-radius:12px;background:#fbf0f6;margin-top:10px}
.scanmsg.ok{background:#e8f9f0;color:#1e8753}
.scanmsg.warn{background:#fff4df;color:#8b5e00}
.scanmsg.danger{background:#ffe9ec;color:#b23047}
.sticky{position:sticky;bottom:0;background:linear-gradient(transparent,rgba(255,245,251,.97) 20%);padding-top:18px}
@media(max-width:560px){
  .nav{grid-template-columns:1fr 1fr}
  .nav button:nth-child(2){grid-column:1/3}
}
</style>
</head>
<body>
<div class="app">
<h1>アイカツスターズ！1弾 QRスキャン</h1>

<section class="panel">
  <div class="statusline"><span id="progressText"></span><span id="positionText"></span></div>
  <div class="bar"><div id="progressBar"></div></div>
  <div class="row" style="margin-top:10px">
    <div class="grow">
      <label class="tiny">表示</label>
      <select id="filterSelect">
        <option value="all">すべて</option>
        <option value="unregistered">未登録のみ</option>
        <option value="registered">登録済みのみ</option>
      </select>
    </div>
    <div style="min-width:130px">
      <label class="tiny">自動送り</label>
      <select id="autoNext">
        <option value="500">0.5秒</option>
        <option value="700">0.7秒</option>
        <option value="1000" selected>1.0秒</option>
        <option value="1500">1.5秒</option>
        <option value="0">しない</option>
      </select>
    </div>
  </div>
</section>

<section class="panel">
  <div class="cardwrap">
    <div>
      <img id="cardImg" class="cardimg" alt="">
    </div>
    <div class="meta">
      <div class="number" id="cardNo"></div>
      <h2 id="cardName"></h2>
      <div class="chips" id="chips"></div>
      <div class="tiny" id="dressKey"></div>
      <div class="qrbox" id="currentQr">QR未登録</div>
    </div>
  </div>
  <div class="nav">
    <button id="prevBtn">← 前へ</button>
    <button id="skipBtn" class="warn">スキップ</button>
    <button id="nextBtn">次へ →</button>
  </div>
</section>

<section class="panel">
  <div class="row" style="margin-bottom:10px">
    <button id="startScanBtn" class="primary">カメラを開始</button>
    <button id="stopScanBtn" disabled>カメラ停止</button>
    <button id="clearQrBtn">現在QRを削除</button>
  </div>
  <div id="reader"></div>
  <div id="scanMsg" class="scanmsg">「カメラを開始」を押してQRを読み取ってください。</div>

  <div style="margin-top:12px">
    <label class="tiny">手動入力</label>
    <textarea id="manualQr" rows="2" placeholder="QR URLを貼り付け"></textarea>
    <div class="row" style="margin-top:8px">
      <button id="manualSaveBtn">現在のカードに登録</button>
    </div>
  </div>
</section>

<div class="sticky">
<section class="panel">
  <div class="row">
    <button id="jumpPrevUnreg">← 前の未登録</button>
    <button id="jumpNextUnreg" class="primary">次の未登録 →</button>
    <div class="grow"></div>
    <button id="exportBtn" class="ok">CSVを書き出す</button>
    <button id="resetBtn" class="danger">登録データを全消去</button>
  </div>
</section>
</div>
</div>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

        currentIndex,
        filter: els.filterSelect.value
      }));
    }catch(e){}
  }

  function restore(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return;
      const st = JSON.parse(raw);
      if(Array.isArray(st.qrs)){
        st.qrs.forEach((q,i) => { if(rows[i]) rows[i].qr_url = q || ''; });
      }
      currentIndex = Number.isInteger(st.currentIndex) ? st.currentIndex : 0;
      if(st.filter) els.filterSelect.value = st.filter;
    }catch(e){}
  }

  function applyFilter(reset=false){
    const f = els.filterSelect.value;
    activeIndices = rows.map((r,i)=>i).filter(i => {
      const has = !!norm(rows[i].qr_url);
      if(f==='unregistered' && has) return false;
      if(f==='registered' && !has) return false;
      return true;
    });
    if(reset || !activeIndices.includes(currentIndex)) currentIndex = activeIndices[0] ?? 0;
    render();
  }

  function render(){
    const r = rows[currentIndex];
    if(!r) return;
    const reg = rows.filter(x => norm(x.qr_url)).length;
    els.progressText.textContent = `${reg} / ${rows.length} 登録済み`;
    els.progressBar.style.width = ((reg/rows.length)*100).toFixed(1) + '%';
    const p = activeIndices.indexOf(currentIndex);
    els.positionText.textContent = `${Math.max(0,p)+1} / ${activeIndices.length}`;

    els.cardNo.textContent = norm(r.card_no);
    els.cardName.textContent = norm(r.card_name);
    els.cardImg.src = norm(r.image_url);
    els.cardImg.alt = norm(r.card_name);

    const type = inferType(r);
    const items = [
      ['タイプ',type],['種類',norm(r.category)],['レアリティ',norm(r.rarity)],['ブランド',norm(r.brand)]
    ].filter(x => x[1]);
    els.chips.innerHTML = items.map(([a,b])=>`<span class="chip">${esc(a)}: ${esc(b)}</span>`).join('');
    els.dressKey.textContent = norm(r.dress_key) ? `dress_key: ${norm(r.dress_key)}` : '';

    const qr = norm(r.qr_url);
    els.currentQr.textContent = qr || 'QR未登録';
    els.currentQr.style.color = qr ? 'var(--ok)' : 'var(--muted)';
    els.manualQr.value = qr;
    save();
  }

  function msg(t,k=''){
    els.scanMsg.className='scanmsg'+(k?' '+k:'');
    els.scanMsg.textContent=t;
  }

  function duplicateOwner(qr){
    return rows.findIndex((r,i)=>i!==currentIndex && norm(r.qr_url)===norm(qr));
  }

  function register(qr){
    qr = norm(qr);
    if(!qr) return;
    const owner = duplicateOwner(qr);
    if(owner>=0){
      const o=rows[owner];
      if(!confirm(`このQRはすでに登録されています。\n\n${o.card_no} ${o.card_name}\n\n現在のカードにも登録しますか？`)) return;
    }
    rows[currentIndex].qr_url = qr;
    msg(`✓ 登録しました: ${rows[currentIndex].card_no}`, 'ok');
    render();
    const d = Number(els.autoNext.value);
    if(d>0) setTimeout(()=>move(1),d);
  }

  function move(delta){
    let p = activeIndices.indexOf(currentIndex);
    if(p<0) p=0;
    p = Math.max(0, Math.min(activeIndices.length-1, p+delta));
    currentIndex = activeIndices[p] ?? currentIndex;
    render();
    msg('QRをスキャンしてください。');
  }

  function jumpUnreg(dir){
    const c = rows.map((r,i)=>i).filter(i=>!norm(rows[i].qr_url));
    if(!c.length){ msg('未登録カードはありません。','ok'); return; }
    if(dir>0) currentIndex = c.find(i=>i>currentIndex) ?? c[0];
    else currentIndex = [...c].reverse().find(i=>i<currentIndex) ?? c[c.length-1];
    render();
  }

  function csvEscape(v){
    v=(v??'').toString();
    return /[",\r\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v;
  }

  function exportCSV(){
    const lines=[HEADERS.map(csvEscape).join(',')];
    rows.forEach(r=>lines.push(HEADERS.map(h=>csvEscape(r[h]??'')).join(',')));
    const blob=new Blob(["\uFEFF"+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});
    const a=document.createElement('a');
    const d=new Date();
    const stamp=`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}_${String(d.getHours()).padStart(2,'0')}${String(d.getMinutes()).padStart(2,'0')}`;
    a.href=URL.createObjectURL(blob);
    a.download=`aikatsu_stars_1dan_qr_${stamp}.csv`;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
  }

  async function startScanner(){
    if(scanning) return;
    if(typeof Html5Qrcode==='undefined'){ msg('QRライブラリを読み込めませんでした。','danger'); return; }
    try{
      html5Qr = html5Qr || new Html5Qrcode('reader');
      await html5Qr.start(
        {facingMode:'environment'},
        {fps:10,qrbox:{width:240,height:240},aspectRatio:1},
        decoded=>{
          const now=Date.now();
          if(decoded===lastScan && now-lastScanAt<1800) return;
          lastScan=decoded; lastScanAt=now;
          register(decoded);
        },
        ()=>{}
      );
      scanning=true;
      els.startScanBtn.disabled=true;
      els.stopScanBtn.disabled=false;
      msg('カメラ起動中。QRを枠内に入れてください。');
    }catch(e){
      msg('カメラを開始できません。HTTPS上で開いているか、カメラ許可を確認してください。','danger');
    }
  }

  async function stopScanner(){
    if(!html5Qr||!scanning) return;
    try{await html5Qr.stop()}catch(e){}
    scanning=false;
    els.startScanBtn.disabled=false;
    els.stopScanBtn.disabled=true;
    msg('カメラを停止しました。');
  }

  els.filterSelect.onchange=()=>applyFilter(true);
  els.prevBtn.onclick=()=>move(-1);
  els.nextBtn.onclick=()=>move(1);
  els.skipBtn.onclick=()=>move(1);
  els.jumpPrevUnreg.onclick=()=>jumpUnreg(-1);
  els.jumpNextUnreg.onclick=()=>jumpUnreg(1);
  els.startScanBtn.onclick=startScanner;
  els.stopScanBtn.onclick=stopScanner;
  els.manualSaveBtn.onclick=()=>register(els.manualQr.value);
  els.clearQrBtn.onclick=()=>{
    if(norm(rows[currentIndex].qr_url) && !confirm('現在のQRを削除しますか？')) return;
    rows[currentIndex].qr_url='';
    render();
    msg('現在のQRを削除しました。','warn');
  };
  els.exportBtn.onclick=exportCSV;
  els.resetBtn.onclick=()=>{
    if(!confirm('登録済みQRをすべて消して最初からにしますか？')) return;
    rows.forEach(r=>r.qr_url='');
    currentIndex=0;
    localStorage.removeItem(STORAGE_KEY);
    applyFilter(true);
    msg('登録データを全消去しました。','warn');
  };

  restore();
  applyFilter(false);
})();
</script>
</body>
</html>
