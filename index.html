<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>アイカツスターズ！QRスキャン（CSV連携）</title>
<style>
:root{
  --bg:#fff7fb; --panel:#fff; --line:#efd9e7; --text:#2d2130; --muted:#7d6d79;
  --accent:#e455a8; --accent2:#7658e8; --ok:#20a464; --warn:#d18a00; --danger:#d94b59;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",Meiryo,sans-serif}
body{min-height:100vh}
.app{max-width:760px;margin:auto;padding:8px 10px 92px}
.hidden{display:none!important}

.topbar{
  position:sticky;top:0;z-index:12;background:rgba(255,247,251,.97);backdrop-filter:blur(10px);
  padding:6px 0 8px;
}
.topcontrols{display:grid;grid-template-columns:1.25fr .75fr;gap:7px;margin-bottom:7px}
select,button,input,textarea{font:inherit}
select,input,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px;background:#fff;color:var(--text)}
button{border:0;border-radius:11px;padding:10px 12px;background:#f8ecf4;color:#452c3c;font-weight:700;cursor:pointer}
button.primary{background:var(--accent);color:#fff}
button.secondary{background:var(--accent2);color:#fff}
button.ok{background:var(--ok);color:#fff}
button.warn{background:#fff3da;color:#8b5e00}
button.danger{background:#ffe8ec;color:#a13043}
button:disabled{opacity:.45}

.current{
  display:grid;grid-template-columns:82px 1fr;gap:10px;background:#fff;border:1px solid var(--line);
  border-radius:15px;padding:8px;box-shadow:0 3px 14px rgba(228,85,168,.08)
}
.thumb{
  width:82px;height:123px;border-radius:10px;object-fit:contain;background:#faf3f8;border:1px solid var(--line)
}
.number{font-size:16px;font-weight:900;color:var(--accent);margin-bottom:2px}
.name{font-size:16px;font-weight:800;line-height:1.25;margin-bottom:7px}
.infoGrid{
  display:grid;grid-template-columns:1fr 1fr;gap:4px 8px;margin-bottom:6px
}
.infoItem{font-size:11px;line-height:1.3}
.infoLabel{color:var(--muted);margin-right:4px}
.dresskey{
  font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  margin-top:2px
}
.progressrow{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--muted);margin-top:6px}
.bar{height:6px;background:#faeaf3;border-radius:999px;overflow:hidden;margin-top:3px}
.bar>div{height:100%;background:linear-gradient(90deg,var(--accent),#f87ab8);width:0%}

.scannerPanel{
  background:#fff;border:1px solid var(--line);border-radius:16px;padding:8px;margin-top:8px;
  box-shadow:0 3px 14px rgba(228,85,168,.06)
}
#reader{width:100%;max-width:520px;margin:0 auto;overflow:hidden;border-radius:12px}
.scanmsg{font-weight:800;text-align:center;padding:8px;border-radius:10px;background:#fbf0f6;margin-top:7px;font-size:13px}
.scanmsg.ok{background:#e8f9f0;color:#1e8753}
.scanmsg.warn{background:#fff4df;color:#8b5e00}
.scanmsg.danger{background:#ffe9ec;color:#b23047}
.scanbuttons{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:7px}
.nav{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:7px}
.qrstate{
  margin-top:7px;padding:7px 9px;border-radius:10px;background:#fffafd;border:1px dashed #ebb8d4;
  font-size:11px;word-break:break-all;max-height:46px;overflow:auto
}

details{background:#fff;border:1px solid var(--line);border-radius:15px;padding:10px;margin-top:10px}
summary{font-weight:800;cursor:pointer}
.section{margin-top:10px}
.tiny{font-size:11px;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1 1 220px}
.searchbox{display:grid;grid-template-columns:1fr auto;gap:7px}

.stickyBottom{
  position:fixed;left:0;right:0;bottom:0;z-index:15;background:rgba(255,247,251,.97);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);padding:7px max(10px,env(safe-area-inset-right)) calc(7px + env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))
}
.stickyBottom .inner{max-width:760px;margin:auto;display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}

.flash{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:50;pointer-events:none;opacity:0;transition:opacity .18s;background:rgba(255,255,255,.82)}
.flash.show{opacity:1}
.flashBox{background:#fff;border:2px solid #bfe8d0;border-radius:20px;padding:20px 24px;text-align:center;box-shadow:0 8px 28px rgba(0,0,0,.12);max-width:85%}
.flashCheck{font-size:42px;color:var(--ok);line-height:1}
.flashName{font-weight:900;font-size:18px;margin-top:6px}
.flashNo{font-size:13px;color:var(--muted);margin-top:3px}

@media(max-height:720px){
  .thumb{width:70px;height:105px}
  .current{grid-template-columns:70px 1fr}
  .name{font-size:15px;margin-bottom:4px}
  .infoItem{font-size:10px}
}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="topcontrols">
      <select id="volumeSelect"></select>
      <select id="filterSelect">
        <option value="all">すべて</option>
        <option value="unregistered">未登録のみ</option>
        <option value="registered">登録済みのみ</option>
      </select>
    </div>

    <div class="current">
      <img id="cardImg" class="thumb" alt="">
      <div>
        <div class="number" id="cardNo"></div>
        <div class="name" id="cardName"></div>

        <div class="infoGrid">
          <div class="infoItem"><span class="infoLabel">タイプ</span><strong id="infoType">-</strong></div>
          <div class="infoItem"><span class="infoLabel">種類</span><strong id="infoCategory">-</strong></div>
          <div class="infoItem"><span class="infoLabel">レア</span><strong id="infoRarity">-</strong></div>
          <div class="infoItem"><span class="infoLabel">ブランド</span><strong id="infoBrand">-</strong></div>
        </div>

        <div class="dresskey" id="dressKeyTop"></div>

        <div class="progressrow">
          <span id="positionText"></span>
          <span id="progressText"></span>
        </div>
        <div class="bar"><div id="progressBar"></div></div>
      </div>
    </div>
  </div>

  <section class="scannerPanel">
    <div id="reader"></div>
    <div class="scanbuttons">
      <button id="startScanBtn" class="primary">カメラを開始</button>
      <button id="stopScanBtn" disabled>カメラ停止</button>
    </div>
    <div id="scanMsg" class="scanmsg">「カメラを開始」を押してください。</div>
    <div class="nav">
      <button id="prevBtn">← 前へ</button>
      <button id="skipBtn" class="warn">スキップ</button>
      <button id="nextBtn">次へ →</button>
    </div>
    <div id="currentQr" class="qrstate">QR未登録</div>
  </section>

  <details>
    <summary>検索・設定・CSV出力</summary>
    <div class="section">
      <label class="tiny">カード番号・カード名で検索</label>
      <div class="searchbox">
        <input id="searchInput" type="text" placeholder="例: 1-4 / ピクニック">
        <button id="clearSearch">クリア</button>
      </div>
    </div>
    <div class="section row">
      <div class="grow">
        <label class="tiny">自動送り</label>
        <select id="autoNext">
          <option value="500">0.5秒</option>
          <option value="700" selected>0.7秒</option>
          <option value="1000">1.0秒</option>
          <option value="1500">1.5秒</option>
          <option value="0">しない</option>
        </select>
      </div>
      <button id="jumpPrevUnreg">← 前の未登録</button>
      <button id="jumpNextUnreg" class="secondary">次の未登録 →</button>
    </div>
    <div class="section">
      <label class="tiny">手動入力</label>
      <textarea id="manualQr" rows="2" placeholder="QR URLを貼り付け"></textarea>
      <div class="row" style="margin-top:7px">
        <button id="manualSaveBtn">現在のカードに登録</button>
        <button id="clearQrBtn">現在QRを削除</button>
      </div>
    </div>
    <div class="section tiny" id="dressKey"></div>
    <div class="section"><a id="detailLink" class="tiny" href="#" target="_blank" rel="noopener noreferrer">公式詳細ページ</a></div>
    <div class="section row">
      <button id="exportVolumeBtn" class="ok">この弾をCSV出力</button>
      <button id="exportAllBtn" class="ok">全11弾をCSV出力</button>
      <button id="resetBtn" class="danger">登録データを全消去</button>
    </div>
  </details>
</div>

<div class="stickyBottom">
  <div class="inner">
    <button id="bottomPrev">← 前</button>
    <button id="bottomSkip" class="warn">スキップ</button>
    <button id="bottomNext">次 →</button>
  </div>
</div>

<div id="flash" class="flash">
  <div class="flashBox">
    <div class="flashCheck">✓</div>
    <div class="flashName" id="flashName"></div>
    <div class="flashNo" id="flashNo"></div>
  </div>
</div>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
const HEADERS = ["index", "card_no", "card_name", "type", "brand", "category", "rarity", "series", "volume", "promo", "image_url", "qr_url", "dress_key", "detail_url", "source_list_url"];

(() => {
  const $ = s => document.querySelector(s);
  const E = {
    volume:$('#volumeSelect'), filter:$('#filterSelect'), autoNext:$('#autoNext'),
    search:$('#searchInput'), clearSearch:$('#clearSearch'),
    progressText:$('#progressText'), positionText:$('#positionText'), progressBar:$('#progressBar'),
    cardImg:$('#cardImg'), cardNo:$('#cardNo'), cardName:$('#cardName'),
    infoType:$('#infoType'), infoCategory:$('#infoCategory'), infoRarity:$('#infoRarity'), infoBrand:$('#infoBrand'),
    dressKeyTop:$('#dressKeyTop'), dressKey:$('#dressKey'), detailLink:$('#detailLink'), currentQr:$('#currentQr'),
    prev:$('#prevBtn'), next:$('#nextBtn'), skip:$('#skipBtn'),
    bPrev:$('#bottomPrev'), bNext:$('#bottomNext'), bSkip:$('#bottomSkip'),
    start:$('#startScanBtn'), stop:$('#stopScanBtn'), clearQr:$('#clearQrBtn'),
    reader:$('#reader'), scanMsg:$('#scanMsg'), manualQr:$('#manualQr'), manualSave:$('#manualSaveBtn'),
    jumpPrev:$('#jumpPrevUnreg'), jumpNext:$('#jumpNextUnreg'),
    exportVolume:$('#exportVolumeBtn'), exportAll:$('#exportAllBtn'), reset:$('#resetBtn'),
    flash:$('#flash'), flashName:$('#flashName'), flashNo:$('#flashNo')
  };

  const STORAGE_KEY='aikatsu_stars_mobile_scan_v3'; // 旧サイトと同一。変更しないこと
  const CSV_PATH='./cards.csv';
  let rows=[];
  let currentIndex=0, activeIndices=[], scanner=null, scanning=false, lastScan='', lastScanAt=0, flashTimer=null;

  const norm=v=>(v??'').toString().trim();
  const esc=s=>(s??'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function rowKey(r){return norm(r.dress_key)||`${norm(r.volume)}|${norm(r.card_no)}|${norm(r.card_name)}`;}
  function inferType(r){
    if(norm(r.type)) return norm(r.type);
    const dk=norm(r.dress_key);
    if(/_Qt_/i.test(dk)) return 'キュート';
    if(/_Co_/i.test(dk)) return 'クール';
    if(/_Se_/i.test(dk)) return 'セクシー';
    if(/_Po_/i.test(dk)) return 'ポップ';
    return '';
  }
  function volumeKey(r){return `${norm(r.series)}|${norm(r.volume)}`;}

  // UTF-8 CSV parser: supports quoted commas, escaped quotes, and line breaks inside quotes.
  function parseCsv(text){
    text=text.replace(/^\uFEFF/,'');
    const table=[];let row=[],field='',quoted=false;
    for(let i=0;i<text.length;i++){
      const c=text[i];
      if(quoted){
        if(c==='"'&&text[i+1]==='"'){field+='"';i++;}
        else if(c==='"')quoted=false;
        else field+=c;
      }else if(c==='"'&&field==='')quoted=true;
      else if(c===','){row.push(field);field='';}
      else if(c==='\r'||c==='\n'){
        if(c==='\r'&&text[i+1]==='\n')i++;
        row.push(field);field='';
        if(row.some(x=>x!==''))table.push(row);
        row=[];
      }else field+=c;
    }
    if(quoted)throw new Error('CSVの引用符が閉じていません');
    if(field!==''||row.length){row.push(field);table.push(row);}
    if(table.length<2)throw new Error('CSVにカードデータがありません');
    const headers=table.shift().map(h=>h.trim());
    for(const col of ['card_no','card_name','series','volume']){
      if(!headers.includes(col))throw new Error('CSVの必須列がありません: '+col);
    }
    return table.map(cells=>{
      const r={};headers.forEach((h,i)=>r[h]=cells[i]??'');
      return r;
    }).filter(r=>norm(r.card_no)&&norm(r.card_name));
  }
  async function initialize(){
    msg('cards.csv を読み込んでいます…');
    try{
      const response=await fetch(CSV_PATH,{cache:'no-store'});
      if(!response.ok)throw new Error(`HTTP ${response.status}`);
      const parsed=parseCsv(await response.text());
      rows=parsed.filter(r=>
        ['アイカツスターズ！','アイカツスターズ！星のツバサ'].includes(norm(r.series))
      );
      if(!rows.length)throw new Error('スターズのカードが見つかりません');
      setupVolumes();restore();applyFilter(false);
      msg(`カードリスト ${rows.length}件を読み込みました。QRをスキャンできます。`,'ok');
    }catch(error){
      console.error('cards.csv load error',error);
      msg('cards.csv が読み込めません。index.html と同じフォルダに配置し、HTTPSまたはローカルサーバーで開いてください。' ,'danger');
      E.cardName.textContent=String(error.message||error);
    }
  }

  function setupVolumes(){
    const keys=[];
    rows.forEach(r=>{const k=volumeKey(r);if(!keys.includes(k))keys.push(k)});
    E.volume.innerHTML=keys.map(k=>{
      const [series,volume]=k.split('|');
      const label=series.includes('星のツバサ')?`星のツバサ ${volume}`:`通常 ${volume}`;
      return `<option value="${esc(k)}">${esc(label)}</option>`;
    }).join('');
  }
  function save(){
    try{
      const old=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');
      const qr={...(old.qr||{})};
      rows.forEach(r=>{
        if(norm(r.qr_url))qr[rowKey(r)]=r.qr_url;
        else delete qr[rowKey(r)];
      });
      localStorage.setItem(STORAGE_KEY,JSON.stringify({qr,currentKey:rowKey(rows[currentIndex]||{}),volume:E.volume.value,filter:E.filter.value,search:E.search.value}));
    }catch(e){}
  }
  function restore(){
    try{
      const raw=localStorage.getItem(STORAGE_KEY);if(!raw)return;
      const st=JSON.parse(raw);
      if(st.qr)rows.forEach(r=>{if(st.qr[rowKey(r)])r.qr_url=st.qr[rowKey(r)]});
      if(st.volume){
        // 旧版は「1弾」のような値。通常弾を優先して復元。
        const v=E.volume.querySelector(`option[value="${CSS.escape(st.volume)}"]`);
        const preferred=`アイカツスターズ！|${st.volume}`;
        if(v) E.volume.value=st.volume;
        else if([...E.volume.options].some(o=>o.value===preferred)) E.volume.value=preferred;
      }
      if(st.filter)E.filter.value=st.filter;
      if(st.search)E.search.value=st.search;
      if(st.currentKey){const i=rows.findIndex(r=>rowKey(r)===st.currentKey);if(i>=0)currentIndex=i}
    }catch(e){}
  }
  function applyFilter(reset=false){
    const v=E.volume.value,f=E.filter.value,q=norm(E.search.value).toLowerCase();
    activeIndices=rows.map((r,i)=>i).filter(i=>{
      const r=rows[i];if(volumeKey(r)!==v)return false;
      const has=!!norm(r.qr_url);
      if(f==='unregistered'&&has)return false;
      if(f==='registered'&&!has)return false;
      if(q&&!(norm(r.card_no).toLowerCase().includes(q)||norm(r.card_name).toLowerCase().includes(q)))return false;
      return true;
    });
    if(reset||!activeIndices.includes(currentIndex))currentIndex=activeIndices[0]??rows.findIndex(r=>volumeKey(r)===v);
    render();
  }
  function render(){
    const r=rows[currentIndex];if(!r)return;
    const vol=E.volume.value,volumeRows=rows.filter(x=>volumeKey(x)===vol),reg=volumeRows.filter(x=>norm(x.qr_url)).length;
    const p=activeIndices.indexOf(currentIndex);
    E.progressText.textContent=`${reg}/${volumeRows.length} 登録`;
    E.positionText.textContent=activeIndices.length?`${p+1}/${activeIndices.length}`:'対象なし';
    E.progressBar.style.width=(volumeRows.length?reg/volumeRows.length*100:0).toFixed(1)+'%';

    E.cardNo.textContent=norm(r.card_no);
    E.cardName.textContent=norm(r.card_name);
    E.cardImg.src=norm(r.image_url);
    E.cardImg.alt=norm(r.card_name);

    E.infoType.textContent=inferType(r)||'-';
    E.infoCategory.textContent=norm(r.category)||'-';
    E.infoRarity.textContent=norm(r.rarity)||'-';
    E.infoBrand.textContent=norm(r.brand)||'-';

    const dk=norm(r.dress_key);
    E.dressKeyTop.textContent=dk?`dress_key: ${dk}`:'dress_key: -';
    E.dressKey.textContent=dk?`dress_key: ${dk}`:'';

    if(norm(r.detail_url)){E.detailLink.href=r.detail_url;E.detailLink.classList.remove('hidden')}else E.detailLink.classList.add('hidden');

    const qr=norm(r.qr_url);
    E.currentQr.textContent=qr||'QR未登録';
    E.currentQr.style.color=qr?'var(--ok)':'var(--muted)';
    E.manualQr.value=qr;
    save();
  }
  function msg(t,k=''){E.scanMsg.className='scanmsg'+(k?' '+k:'');E.scanMsg.textContent=t;}
  function flash(r){
    clearTimeout(flashTimer);
    E.flashName.textContent=norm(r.card_name);E.flashNo.textContent=norm(r.card_no);
    E.flash.classList.add('show');flashTimer=setTimeout(()=>E.flash.classList.remove('show'),420);
  }
  function dupOwner(qr){return rows.findIndex((r,i)=>i!==currentIndex&&norm(r.qr_url)===norm(qr));}
  function register(qr){
    qr=norm(qr);if(!qr)return;
    const d=dupOwner(qr);
    if(d>=0){
      const o=rows[d];
      if(!confirm(`このQRは登録済みです。\n\n${o.volume} / ${o.card_no} ${o.card_name}\n\n現在のカードにも登録しますか？`))return;
    }
    const scannedRow=rows[currentIndex];scannedRow.qr_url=qr;flash(scannedRow);msg(`✓ ${scannedRow.card_no} 登録完了`,'ok');render();
    const delay=Number(E.autoNext.value);if(delay>0)setTimeout(()=>move(1),delay);
  }
  function move(delta){
    if(!activeIndices.length)return;
    let p=activeIndices.indexOf(currentIndex);if(p<0)p=0;
    p=Math.max(0,Math.min(activeIndices.length-1,p+delta));currentIndex=activeIndices[p];render();msg('QRをスキャンしてください。');
  }
  function jumpUnreg(dir){
    const v=E.volume.value,c=rows.map((r,i)=>i).filter(i=>volumeKey(rows[i])===v&&!norm(rows[i].qr_url));
    if(!c.length){msg('この弾の未登録カードはありません。','ok');return;}
    if(dir>0)currentIndex=c.find(i=>i>currentIndex)??c[0];else currentIndex=[...c].reverse().find(i=>i<currentIndex)??c[c.length-1];render();
  }
  function csvEscape(v){v=(v??'').toString();return /[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
  function exportRows(data,name){
    const lines=[HEADERS.map(csvEscape).join(',')];data.forEach(r=>lines.push(HEADERS.map(h=>csvEscape(r[h]??'')).join(',')));
    const blob=new Blob(["\uFEFF"+lines.join('\r\n')],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
  }
  function stamp(){const d=new Date();return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}_${String(d.getHours()).padStart(2,'0')}${String(d.getMinutes()).padStart(2,'0')}`;}
  async function startScanner(){
    if(scanning)return;if(typeof Html5Qrcode==='undefined'){msg('QRライブラリを読み込めませんでした。','danger');return;}
    try{
      scanner=scanner||new Html5Qrcode('reader');
      await scanner.start({facingMode:'environment'},{fps:12,qrbox:{width:230,height:230},aspectRatio:1},decoded=>{
        const now=Date.now();if(decoded===lastScan&&now-lastScanAt<1800)return;lastScan=decoded;lastScanAt=now;register(decoded);
      },()=>{});
      scanning=true;E.start.disabled=true;E.stop.disabled=false;msg('カメラ起動中。上のカード情報を確認しながらQRを読み取ってください。');
    }catch(e){msg('カメラを開始できません。HTTPSとカメラ許可を確認してください。','danger');}
  }
  async function stopScanner(){if(!scanner||!scanning)return;try{await scanner.stop()}catch(e){}scanning=false;E.start.disabled=false;E.stop.disabled=true;msg('カメラを停止しました。');}

  initialize();

  E.volume.onchange=()=>applyFilter(true);E.filter.onchange=()=>applyFilter(true);E.search.oninput=()=>applyFilter(true);
  E.clearSearch.onclick=()=>{E.search.value='';applyFilter(true)};
  [E.prev,E.bPrev].forEach(x=>x.onclick=()=>move(-1));
  [E.next,E.bNext].forEach(x=>x.onclick=()=>move(1));
  [E.skip,E.bSkip].forEach(x=>x.onclick=()=>move(1));
  E.jumpPrev.onclick=()=>jumpUnreg(-1);E.jumpNext.onclick=()=>jumpUnreg(1);
  E.start.onclick=startScanner;E.stop.onclick=stopScanner;E.manualSave.onclick=()=>register(E.manualQr.value);
  E.clearQr.onclick=()=>{if(norm(rows[currentIndex].qr_url)&&!confirm('現在のQRを削除しますか？'))return;rows[currentIndex].qr_url='';render();msg('現在のQRを削除しました。','warn');};
  E.exportVolume.onclick=()=>{const v=E.volume.value;exportRows(rows.filter(r=>volumeKey(r)===v),`aikatsu_stars_${v.replace(/[^\w一-龠ぁ-んァ-ン]/g,'_')}_qr_${stamp()}.csv`)};
  E.exportAll.onclick=()=>exportRows(rows,`aikatsu_stars_all_regular_qr_${stamp()}.csv`);
  E.reset.onclick=()=>{if(!confirm('このサイトの保存済みQRをすべて消去しますか？'))return;rows.forEach(r=>r.qr_url='');currentIndex=0;localStorage.removeItem(STORAGE_KEY);applyFilter(true);msg('登録データを全消去しました。','warn');};
})();
</script>
</body>
</html>
